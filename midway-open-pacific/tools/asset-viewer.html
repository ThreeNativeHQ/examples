<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Midway asset inspection</title>
<style>
body{margin:0;background:#303943;color:#eef3f6;font:14px system-ui}canvas{display:block}
nav{position:absolute;inset:16px 16px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#18212bdc;padding:12px;border-radius:8px}
select,button{font:inherit;padding:8px;color:inherit;background:#364554;border:1px solid #75899c;border-radius:4px}
label{display:flex;gap:8px;align-items:center}output{position:absolute;bottom:16px;left:16px;background:#18212bdd;padding:12px;white-space:pre-line}
</style>
<nav aria-label="Asset controls">
<label>Model <select id="asset"></select></label>
<label>Animation <select id="clip"><option>Rest pose</option></select></label>
<button id="pause">Pause</button><button data-view="quarter">Quarter</button><button data-view="side">Side</button><button data-view="top">Top</button>
<span>Orthographic · drag to orbit · scroll to zoom</span>
</nav><output id="stats">Loading renderer…</output>
<script type="module">
import * as T from 'three';
import {WebGPURenderer,PMREMGenerator} from 'three/webgpu';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const files=['aircraft.tbd-devastator.glb','aircraft.tbd-devastator.ai.glb','aircraft.b5n2-kate.glb',
 'carrier.kaga.glb','carrier.soryu.glb','carrier.hiryu.glb','carrier.yorktown.glb',
 'cruiser.tone.glb','cruiser.mogami.glb','destroyer.kagero.glb','destroyer.hammann.glb',
 'submarine.i168.glb','submarine.nautilus.glb','weapon.torpedo.glb',
 'carrier-aircraft-pilot.glb','flight-deck-director.glb','deck-crew.glb','boat.pt59.glb'];
const picker=document.querySelector('#asset'), clips=document.querySelector('#clip'), stats=document.querySelector('#stats');
for(const name of files)picker.add(new Option(name,name));
const renderer=new WebGPURenderer({antialias:true});await renderer.init();
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x505d68);
const pmrem=new PMREMGenerator(renderer),room=new RoomEnvironment();
scene.environment=pmrem.fromScene(room,.04).texture;room.dispose();
scene.add(new T.HemisphereLight(0xdbeaff,0x555044,1.4));
const sun=new T.DirectionalLight(0xffefdf,3);sun.position.set(-5,9,-7);scene.add(sun);
const camera=new T.OrthographicCamera(-1,1,1,-1,.01,10000);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
let gltf,mixer,paused=false,radius=1,info,loadId=0;
const centre=new T.Vector3();
function view(name='quarter'){
 const aspect=innerWidth/innerHeight,h=radius*1.2;
 camera.left=-h*aspect;camera.right=h*aspect;camera.top=h;camera.bottom=-h;
 camera.near=Math.max(.001,radius/1000);camera.far=radius*20;camera.zoom=1;
 camera.position.copy(centre).add(new T.Vector3(...({quarter:[-1,.65,-1.4],side:[1,0,0],top:[0,1,.001]}[name])).normalize().multiplyScalar(radius*3));
 camera.up.set(0,1,0);camera.lookAt(centre);camera.updateProjectionMatrix();controls.target.copy(centre);controls.update();
}
function animate(name){
 mixer.stopAllAction();
 if(name)mixer.clipAction(T.AnimationClip.findByName(gltf.animations,name)).reset().play();
 mixer.update(0);clips.value=name;
}
async function load(name){
 const id=++loadId;stats.textContent='Loading '+name;window.assetReview.ready=false;
 const next=await new GLTFLoader().loadAsync('/assets/'+name);
 if(id!==loadId)return;
 if(gltf){scene.remove(gltf.scene);mixer.stopAllAction();mixer.uncacheRoot(gltf.scene);
  const materials=new Set(),textures=new Set();gltf.scene.traverse(n=>{if(n.isMesh){n.geometry.dispose();for(const m of Array.isArray(n.material)?n.material:[n.material])materials.add(m);}});
  for(const m of materials){for(const v of Object.values(m))if(v?.isTexture)textures.add(v);m.dispose();}for(const t of textures)t.dispose();}
 gltf=next;scene.add(gltf.scene);mixer=new T.AnimationMixer(gltf.scene);
 gltf.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(gltf.scene);box.getCenter(centre);radius=box.getBoundingSphere(new T.Sphere()).radius;
 let triangles=0,meshes=0;const materials=new Set(),textures=new Set();
 gltf.scene.traverse(n=>{if(n.isMesh){meshes++;triangles+=(n.geometry.index?.count??n.geometry.attributes.position.count)/3;
  for(const m of Array.isArray(n.material)?n.material:[n.material]){materials.add(m);for(const t of Object.values(m))if(t?.isTexture){textures.add(t);t.anisotropy=renderer.getMaxAnisotropy();t.needsUpdate=true;}}}});
 info={file:name,triangles,meshes,materials:materials.size,textures:textures.size,size:box.getSize(new T.Vector3()).toArray(),clips:gltf.animations.map(c=>c.name)};
 clips.replaceChildren(new Option('Rest pose',''));for(const c of gltf.animations)clips.add(new Option(c.name,c.name));
 picker.value=name;view();stats.textContent=`${name}\n${triangles.toLocaleString()} triangles · ${textures.size} textures · ${gltf.animations.length} clips\nXYZ: ${info.size.map(n=>n.toFixed(2)).join(' × ')} m · source proportions preserved`;
 window.assetReview.ready=true;return info;
}
window.assetReview={ready:false,files,load,view,animate,get info(){return info},get model(){return gltf?.scene},get mixer(){return mixer},set paused(v){paused=v}};
picker.onchange=()=>load(picker.value).catch(e=>{stats.textContent=e.message;throw e});clips.onchange=()=>animate(clips.value);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);view()});
let previous=performance.now();renderer.setAnimationLoop(()=>{const now=performance.now();if(mixer&&!paused)mixer.update(Math.min((now-previous)/1000,.05));previous=now;controls.update();renderer.render(scene,camera)});
await load(new URLSearchParams(location.search).get('asset')||files[0]);
</script>
</html>
