<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wildwood — sky HDRI harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Standalone proof for `src/render/sky-hdri.ts`: the HDRI on a WebGPURenderer, over a bare
      // ground plane and three spheres, lit by the environment alone — no sun, no hemisphere, no
      // post chain. If the spheres read as outdoor objects and the background is a pine slope,
      // the HDRI is doing the lighting. Served by the game's own vite dev server (`pnpm dev`).
      import { ACESFilmicToneMapping, Mesh, MeshStandardMaterial, PerspectiveCamera, PlaneGeometry, Scene, SphereGeometry } from "three";
      import { WebGPURenderer } from "three/webgpu";
      import { setupSkyHdri } from "/src/render/sky-hdri.ts";

      const scene = new Scene();
      const camera = new PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 10);
      camera.lookAt(0, 4, -30);

      const renderer = new WebGPURenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = ACESFilmicToneMapping;
      // The game's own exposure, from its TN_WORLD_ENVIRONMENT line — the harness judges the HDRI
      // under the same tone curve the valley will show it in.
      renderer.toneMappingExposure = 1.24;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      // Deliberately lit by nothing else: the environment is the only light in this scene.
      const ground = new Mesh(
        new PlaneGeometry(400, 400),
        new MeshStandardMaterial({ color: 0x4f6b34, roughness: 0.95 }),
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const mkSphere = (x, material) => {
        const sphere = new Mesh(new SphereGeometry(1.2, 48, 32), material);
        sphere.position.set(x, 1.2, 0);
        scene.add(sphere);
      };
      mkSphere(-3, new MeshStandardMaterial({ color: 0x6a6660, roughness: 0.9 }));
      mkSphere(0, new MeshStandardMaterial({ color: 0x9aa08f, roughness: 0.25 }));
      mkSphere(3, new MeshStandardMaterial({ color: 0x4a3a2c, roughness: 0.6 }));

      // The hashed output name the asset compiler published — the logical name 404s into an HTML
      // error page, which HDRLoader reports as "bad initial token".
      await setupSkyHdri(scene, renderer, "/hdri/forest_slope_2k.f324ca8d.hdr");

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
      console.info("TN_SKY_HARNESS_READY");
    </script>
  </body>
</html>
